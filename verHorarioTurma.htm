<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horário da Turma | Escola Básica de Manhente</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Montserrat',Arial,sans-serif;
  background:#f0fdf4;
  color:#1f2933;
}
header{
  background:linear-gradient(135deg,#166534,#15803d);
  color:#fff;
  padding:28px 20px 30px;
  box-shadow:0 5px 18px rgba(0,0,0,.14);
}
.cabecalho{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:20px;
}
.logo-eb{
  width:82px;
  height:82px;
  object-fit:contain;
  background:#fff;
  border-radius:50%;
  padding:6px;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}
.titulos h1{
  margin:0;
  font-size:clamp(1.25rem,3vw,2rem);
  font-weight:800;
  line-height:1.2;
}
.titulos h2{
  margin:7px 0 0;
  font-size:1.12rem;
  font-weight:600;
}
.titulos p{
  margin:6px 0 0;
  font-size:.92rem;
  opacity:.9;
}
main{
  max-width:1200px;
  margin:30px auto 45px;
  padding:0 20px;
}
.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.voltar{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:11px 17px;
  border-radius:999px;
  background:#fff;
  color:#166534;
  text-decoration:none;
  font-weight:700;
  border:1px solid #bbf7d0;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  transition:.2s;
}
.voltar:hover{
  transform:translateY(-2px);
  background:#dcfce7;
}
.acoes{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.pdf{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:11px 17px;
  border-radius:999px;
  background:#fff;
  color:#b91c1c;
  text-decoration:none;
  font-weight:700;
  border:1px solid #fecaca;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  transition:.2s;
}
.pdf:hover{
  transform:translateY(-2px);
  background:#fef2f2;
}
.cartao{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 7px 22px rgba(0,0,0,.09);
  overflow:auto;
}
.cabecalho-horario{
  display:flex;
  align-items:center;
  gap:10px;
  color:#166534;
  font-size:1.15rem;
  font-weight:700;
  margin-bottom:15px;
}
.cabecalho-horario i{color:#16a34a}
.horario-wrap{
  background:#f8fafc;
  border-radius:12px;
  padding:10px;
  text-align:center;
  min-height:300px;
}
#HORARIO{
  display:block;
  max-width:100%;
  height:auto;
  margin:0 auto;
  border-radius:8px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
.nota{
  margin-top:14px;
  text-align:center;
  color:#64748b;
  font-size:.78rem;
}
footer{
  text-align:center;
  color:#64748b;
  font-size:.75rem;
  padding:0 20px 25px;
}
footer a{color:#166534}

@media(max-width:600px){
  header{padding:22px 16px 26px}
  .cabecalho{gap:13px}
  .logo-eb{width:64px;height:64px}
  .titulos h1{font-size:1.1rem}
  .titulos h2{font-size:.9rem}
  .titulos p{font-size:.76rem}
  main{padding:0 12px;margin-top:22px}
  .acoes{width:100%}
  .voltar,.pdf{flex:1;justify-content:center}
  .cartao{padding:12px}
}
</style>
</head>

<body>
<header>
  <div class="cabecalho">
    <a href="index.html" aria-label="Voltar ao início">
      <img src="logo-eb-manhente.png" alt="Símbolo da Escola Básica de Manhente" class="logo-eb">
    </a>
    <div class="titulos">
      <h1>AGRUPAMENTO DE ESCOLAS ALCAIDES DE FARIA</h1>
      <h2>Escola Básica de Manhente</h2>
      <p>Horários das Turmas · 2026 / 2027</p>
    </div>
  </div>
</header>

<main>
  <div class="topo">
    <div class="acoes">
      <a class="voltar" href="HorTurmas.htm">
        <i class="fa-solid fa-arrow-left"></i> Voltar à lista
      </a>
      <a class="pdf" href="#" id="PDFLINK" aria-label="Abrir horário em PDF">
        <i class="fa-solid fa-file-pdf"></i> Versão PDF
      </a>
    </div>
  </div>

  <div class="cartao">
    <div class="cabecalho-horario">
      <i class="fa-solid fa-calendar-days"></i>
      <span>Horário da turma</span>
    </div>
    <div class="horario-wrap">
      <img id="HORARIO" alt="Horário da turma">
    </div>
    <div class="nota">
      Este horário pode sofrer alterações.
    </div>
  </div>
</main>

<footer>
  Escola Básica de Manhente · Agrupamento de Escolas Alcaides de Faria
</footer>

<script>
const istr = window.location.search.slice(1);

if (istr) {
  document.getElementById("HORARIO").src = istr + ".png";
  document.getElementById("HORARIO").alt = "Horário da turma";
  document.getElementById("PDFLINK").href = istr + ".pdf";
} else {
  document.getElementById("HORARIO").alt = "Não foi indicado um horário.";
  document.getElementById("PDFLINK").style.display = "none";
}
</script>
</body>
</html>
